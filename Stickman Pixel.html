        if(Math.random()<.035)flm.push({x:tx,y:ty,vx:-bc*50+(Math.random()-.5)*30,vy:-bk*50-20,t:0,life:.35+Math.random()*.15,sz:1.7+Math.random()*.6,c:.5+Math.random()*.3,sd:Math.random()*999|0,h:1})}
      if(Math.random()<.25){const sa2=b.a+Math.PI+(Math.random()-.5)*.9,sp=60+Math.random()*140;
        parts.push({x:tx,y:ty,vx:Math.cos(sa2)*sp,vy:Math.sin(sa2)*sp-30,life:.12+Math.random()*.18,c:['#fff6a8','#ffd24a','#ff8a1f'][Math.random()*3|0]})}}
    b.x=nx;b.y=ny}
  bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<WW);
  for(const q of flm){q.t+=dt;const ag=Math.min(1,q.t/q.life),dr=(2.4+ag*2)*dt;q.vx-=q.vx*dr;q.vy-=q.vy*dr;q.vy-=(80+ag*420)*dt;q.vx+=Math.sin(q.t*19+q.sd)*90*ag*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(!q.h){const cx=Math.floor(q.x/CELL),cy=Math.floor(q.y/CELL);if(cx>=0&&cy>=0&&cx<CW&&cy<GCELL&&cellM[cy*CW+cx]===1){q.h=1;q.vx*=.2;q.vy*=.2;q.life=Math.min(q.life,q.t+.18)}}
    if(q.t/q.life>.65&&q.h&&Math.random()<.02&&smk.length<380)smk.push({x:q.x+(Math.random()-.5)*4,y:q.y,vx:q.vx*.1+(Math.random()-.5)*30,vy:-34-Math.random()*34,life:.55+Math.random()*.35,max:.8,r0:.8,r1:1.5+Math.random()*1.4,sd:Math.random()*999|0,wb:12+Math.random()*14,tb:(Math.random()-.5)*.3,nh:1,hot:0})}
  for(const r of rimF){r.t+=dt;if(holeF[r.k])r.t=r.life;const f=Math.max(0,1-r.t/r.life);
    if(Math.random()<dt*(7+10*f)&&flm.length<460)flm.push({x:r.x+(Math.random()-.5)*CELL,y:r.y-CELL*.5,vx:(Math.random()-.5)*26,vy:-45-Math.random()*50,t:0,life:.28+Math.random()*.3*f+.1,sz:.9+.7*f*Math.random(),c:.2+Math.random()*.5,sd:Math.random()*999|0,h:1,rim:1});
    if(Math.random()<dt*3&&heat.length<4000)heat.push({i:r.i,t:0})}
  rimF=rimF.filter(r=>r.t<r.life);
  for(const q of flm)if(q.t>=q.life&&q.sm&&smk.length<380){const l=.8+Math.random()*.6;
    smk.push({x:q.x,y:q.y,vx:q.vx*.6,vy:q.vy*.6-12,life:l,max:l,r0:q.sz*1.3,r1:q.sz*1.3+1.6+Math.random()*1.4,sd:Math.random()*999|0,wb:10+Math.random()*10,tb:(Math.random()-.5)*.3,nh:1,hot:.35})}
  flm=flm.filter(q=>q.t<q.life);
  for(const q of smk){q.vx+=Math.sin(q.life*q.wb+q.sd)*45*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-2.2*dt);q.vy=q.vy*Math.exp(-2.2*dt)-26*dt;q.life-=dt}smk=smk.filter(q=>q.life>0);if(smk.length>520)smk.splice(0,smk.length-520);
  for(const q of lDust){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-(q.dm||3.4)*dt);q.vy=q.vy*Math.exp(-3*dt)-14*dt;q.life-=dt}lDust=lDust.filter(q=>q.life>0);
  for(const q of rings)q.t+=dt;rings=rings.filter(q=>q.t<q.life);
  for(const q of fbs){if(q.t<0){q.t+=dt;continue}q.t+=dt;q.vy-=190*dt;q.vx+=Math.sin(q.t*17+q.sd)*60*dt;q.vx-=q.vx*5*dt;q.vy-=q.vy*3.2*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.t>=q.life&&q.sm&&smk.length<500){const l=.6+Math.random()*.4;smk.push({x:q.x,y:q.y,vx:q.vx*.6,vy:q.vy*.6-12,life:l,max:l,r0:q.size*.2,r1:q.size*.34,sd:Math.random()*999|0,wb:5,tb:0,nh:1,hot:0})}}
  fbs=fbs.filter(q=>q.t<q.life);
  for(const q of nbl)nblStep(q,dt);nbl=nbl.filter(q=>q.t<q.life);for(const q of ifr)q.t+=dt;ifr=ifr.filter(q=>q.t<q.life);for(const q of nst)nsStep(q,dt);nst=nst.filter(q=>q.t<q.life+.05);
  for(const q of ntr)q.t+=dt;ntr=ntr.filter(q=>q.t<q.life);
  for(const q of nsp){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-3*dt;q.vy*=1-3*dt;q.vy+=18*CZ*CELL*dt}nsp=nsp.filter(q=>q.life>0);
  for(const q of parts){q.vy+=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}
  {const dk=Math.exp(-1.4*dt);for(const q of spk){q.life-=dt;q.vy+=(q.cas?1500:1100)*dt;if(!q.cas){q.vx*=dk}
    const nx=q.x+q.vx*dt,ny=q.y+q.vy*dt;
    if(solidAt(nx,ny)){q.b++;if(q.b>(q.cas?4:2)){q.life=0;continue}
      if(!solidAt(q.x,ny)){q.vy*=-.45;q.vx*=.8;if(Math.abs(q.vy)<40&&q.cas)q.vy=0}else if(!solidAt(nx,q.y))q.vx*=-.5;else{q.vx*=-.4;q.vy*=-.4}}
    else{q.x=nx;q.y=ny}}
   spk=spk.filter(q=>q.life>0)}
  parts=parts.filter(q=>q.life>0);
}

function ik(a,b,l1,l2,bend){const dx=b.x-a.x,dy=b.y-a.y;const d=clamp(Math.hypot(dx,dy),Math.abs(l1-l2)+0.01,l1+l2-0.01);
  const an=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)),base=Math.atan2(dy,dx);
  return{x:a.x+l1*Math.cos(base+bend*an),y:a.y+l1*Math.sin(base+bend*an)}}
let P_=null;
function pose1(ao){
  const f=p.face,sp=Math.abs(p.vx),m=p.on?clamp(sp/60,0,1):0,dm=p.vx>=0?1:-1,ph=p.phase,TAU=Math.PI*2;
  const br=Math.sin(p.t*2.4),idle=p.on?1-m:0;
  const hip={x:0,y:-(LEG*(0.94-0.14*(p.on?clamp(sp/WALK,0,1):0))-R*(m*4*Math.abs(Math.cos(TAU*ph))+idle*(3+3*br)))};
  const kd=f,legs=[],Ae=A*(p.vx*f<0?0.72:1),ft=[];
  if(p.on)hip.y+=p.oy;
  for(let i=0;i<2;i++){let fx,fy;
    if(p.on){const u=(ph+i*0.5)%1;let wx,wy=0;
      if(u<0.5)wx=Ae*(1-4*u);else{const s=(u-0.5)*2,e=s*s*(3-2*s);wx=Ae*(2*e-1);wy=LIFT*Math.sin(Math.PI*s)}
      fx=lerp(p.pl[i]-p.x,dm*wx,m);fy=-wy*m-(1-m)*p.lf[i];
      const g=footY(p.x+fx);if(g!==null)fy+=g-p.y} // kaki menyesuaikan tinggi pijakan di titiknya (groundNear)
    else{const t=clamp(-p.vy/900,0,1);fx=R*(i?-f*8:f*12);fy=R*(i?-(4+10*t):-(10+18*t))}
    ft.push({x:fx,y:fy})}
  if(p.on){const L=LEG*.985;for(const q of ft){const dx=q.x-hip.x,dy=q.y-hip.y;if(dy>0&&dx*dx+dy*dy>L*L)hip.y=q.y-Math.sqrt(Math.max(0,L*L-dx*dx))}} // tubuh turun agar kaki tak terentang
  for(let i=0;i<2;i++){const foot=ft[i];p.lastF[i]=p.x+foot.x;legs.push({foot,knee:ik(hip,foot,TH,SH,-kd)})}
  const lean=clamp(p.vx/WALK,-1,1)*0.12;
  const sh={x:hip.x+Math.sin(lean)*TORSO,y:hip.y-Math.cos(lean)*TORSO};
  const ha=lean*1.3,head={x:sh.x+Math.sin(ha)*(NECK+HEADR),y:sh.y-Math.cos(ha)*(NECK+HEADR)};
  const aim=rgL?rg.a:ao!==undefined?ao:Math.atan2(mouse.y-(p.y+sh.y),mouse.x+camx-(p.x+sh.x));
  const rcx=-Math.cos(aim)*rcX,rcy=-Math.sin(aim)*rcX*.5;sh.x+=rcx*9;sh.y+=rcy*9;head.x+=rcx*14;head.y+=rcy*14-rcX*1.5; // badan terdorong ke belakang
  const h0={x:sh.x+Math.cos(aim)*(UA+FA-6*R),y:sh.y+Math.sin(aim)*(UA+FA-6*R)};
  const h1={x:sh.x+R*(dm*20*m*Math.cos(TAU*ph)-(1-m)*f*4),y:sh.y+R*(46-8*m*Math.abs(Math.sin(TAU*ph))-(p.on?0:14)+idle*br*1.5)};
  const arms=[{hand:h0,elbow:ik(sh,h0,UA,FA,f)},{hand:h1,elbow:ik(sh,h1,UA,FA,kd)}];
  let wa=aim;

    const u=clamp(-Math.sin(aim)*1.5,0,1),bx=f*Math.sin(.4),by=-Math.cos(.4),vx=bx+(Math.cos(aim)-bx)*u,vy=by+(Math.sin(aim)-by)*u;wa=Math.atan2(vy,vx);

  if(Wp.rear){const sd=fl?-1:1,qx=(Wp.rear[0]-Wp.px)*PC,qy=sd*(Wp.rear[1]-Wp.py)*PC; // popor di pundak: ujung belakang senjata menempel pundak, tangan belakang di gagang (membidik)

  return{hip,sh,head,legs,arms,aim:wa,ao:aim,mx:p.x+h0.x+lx*ca-ly*sa,my:p.y+h0.y+lx*sa+ly*ca}
}

function poseG(){let Q=pose1();if(rgL||cw===8)return Q;const tx=mouse.x+camx,ty=mouse.y,d0=Math.hypot(tx-Q.mx,ty-Q.my);if(d0<40)return Q;
  const a0=Q.ao;let a=a0;for(let i=0;i<5;i++){let d=Math.atan2(ty-Q.my,tx-Q.mx)-Q.aim;d=Math.atan2(Math.sin(d),Math.cos(d));if(Math.abs(d)<.0004)break;a+=d;Q=pose1(a)}

  const u=clamp((d0-40)/70,0,1),w=u*u*(3-2*u);let dd=a-a0;dd=Math.atan2(Math.sin(dd),Math.cos(dd));return pose1(a0+dd*w)}
function drawFig(c,Q,ox,oy){
  c.lineCap='round';c.lineJoin='round';c.lineWidth=4;
  const rgb=a=>'rgb('+a+')',L=(a,b)=>{c.beginPath();c.moveTo(ox+a.x,oy+a.y);c.lineTo(ox+b.x,oy+b.y);c.stroke()};
  const limb=(a,k,b)=>{c.beginPath();c.moveTo(ox+a.x,oy+a.y);c.lineTo(ox+k.x,oy+k.y);c.lineTo(ox+b.x,oy+b.y);c.stroke()};
  c.strokeStyle=rgb(COL.B);limb(Q.hip,Q.legs[1].knee,Q.legs[1].foot);limb(Q.sh,Q.arms[1].elbow,Q.arms[1].hand);
  c.strokeStyle=rgb(COL.F);L(Q.hip,Q.sh);limb(Q.hip,Q.legs[0].knee,Q.legs[0].foot);
  c.beginPath();c.arc(ox+Q.head.x,oy+Q.head.y,HEADR,0,Math.PI*2);c.stroke();

}
